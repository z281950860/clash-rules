version = 1

# my-clash-ai v4.3 lite
# 修复：在外部配置中显式定义节点国旗 Emoji 规则，
# 避免依赖转换后端自身是否内置 emoji 映射。
#
# 说明：
# 1. add_emoji = true：按下方规则给节点名称添加国旗
# 2. remove_old_emoji = true：先移除机场原有 emoji，避免重复
# 3. 未能从节点名称判断地区的节点（例如“9D”）不会强行加旗

[custom]
clash_rule_base = "base/all_base.tpl"
enable_rule_generator = true
overwrite_original_rules = true
add_emoji = true
remove_old_emoji = true

# ==============================
# 节点国旗 Emoji
# 规则按顺序匹配，具体地区放在前面
# ==============================

[[custom.emoji]]
match = '(?i:\bHK[G]?\b|Hong\s*Kong|香港|九龙|九龍)'
emoji = '🇭🇰'

[[custom.emoji]]
match = '(?i:\bMO\b|\bMAC\b|Macau|Macao|澳门|澳門)'
emoji = '🇲🇴'

[[custom.emoji]]
match = '(?i:\bTW[N]?\b|Taiwan|台湾|台灣|台北|新北|高雄|彰化)'
emoji = '🇹🇼'

[[custom.emoji]]
match = '(?i:\bSG\b|\bSIN\b|Singapore|新加坡|狮城|獅城)'
emoji = '🇸🇬'

[[custom.emoji]]
match = '(?i:\bJP[N]?\b|Japan|Tokyo|Osaka|Saitama|日本|东京|東京|大阪|埼玉)'
emoji = '🇯🇵'

[[custom.emoji]]
match = '(?i:\bKR\b|\bKOR\b|Korea|Seoul|韩国|韓國|首尔|首爾)'
emoji = '🇰🇷'

[[custom.emoji]]
match = '(?i:\bUS\b|\bUSA\b|United\s*States|America|美国|美國|洛杉矶|洛杉磯|Seattle|西雅图|西雅圖|San\s*Jose|圣何塞|聖何塞|Dallas|达拉斯|達拉斯|New\s*York|纽约|紐約|Chicago|芝加哥)'
