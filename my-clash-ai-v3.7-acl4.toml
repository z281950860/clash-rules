version = 1

[custom]
clash_rule_base = "https://raw.githubusercontent.com/z281950860/clash-rules/main/clash-base-v3.7-acl4.yaml"
enable_rule_generator = true
overwrite_original_rules = true

# 1. 节点选择
[[custom_groups]]
name = "🚀 节点选择"
type = "select"
rule = ["[]♻️ 自动选择", ".*"]

# 2. 自动选择
# lazy=true：策略组实际使用时再检测，降低 Wi-Fi 瞬时波动造成的集中假超时
# interval=300：每 5 分钟检测一次，更接近 ACL4SSR 默认测速节奏
# tolerance=150：更接近 ACL4SSR 美国节点组的容差，减少抖动时频繁切换
[[custom_groups]]
name = "♻️ 自动选择"
type = "url-test"
rule = [".*"]
url = "http://www.gstatic.com/generate_204"
interval = 300
tolerance = 150
lazy = true

# 3. AI 服务
[[custom_groups]]
name = "🤖 AI服务"
type = "select"
rule = ["[]🚀 节点选择", "[]♻️ 自动选择", ".*"]

# 4. 奈飞服务
[[custom_groups]]
name = "🎬 奈飞服务"
type = "select"
rule = ["[]🚀 节点选择", "[]♻️ 自动选择", ".*"]

# 5. 电报服务
[[custom_groups]]
name = "✈️ 电报服务"
type = "select"
rule = ["[]🚀 节点选择", "[]♻️ 自动选择", ".*"]

# 6. YouTube
[[custom_groups]]
name = "📺 YouTube"
type = "select"
rule = ["[]🚀 节点选择", "[]♻️ 自动选择", ".*"]

# 7. GitHub
[[custom_groups]]
name = "💻 GitHub"
type = "select"
rule = ["[]🚀 节点选择", "[]♻️ 自动选择", ".*"]

# 8. 漏网之鱼
[[custom_groups]]
name = "🐟 漏网之鱼"
type = "select"
rule = ["[]🚀 节点选择", "[]♻️ 自动选择", "[]DIRECT"]

# AI 服务
[[rulesets]]
group = "🤖 AI服务"
ruleset = "clash-classic:https://cdn.jsdelivr.net/gh/VPSDance/ai-proxy-rules@main/rules/clash/all.yaml"
interval = 86400

# Netflix
[[rulesets]]
group = "🎬 奈飞服务"
ruleset = "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list"
interval = 86400

# Telegram
[[rulesets]]
group = "✈️ 电报服务"
ruleset = "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list"
interval = 86400

# YouTube
[[rulesets]]
group = "📺 YouTube"
ruleset = "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list"
interval = 86400

# GitHub
[[rulesets]]
group = "💻 GitHub"
ruleset = "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list"
interval = 86400

# 国内/局域网直连
[[rulesets]]
group = "DIRECT"
ruleset = "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.list"
interval = 86400

[[rulesets]]
group = "DIRECT"
ruleset = "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax.list"
interval = 86400

[[rulesets]]
group = "DIRECT"
ruleset = "[]GEOIP,CN"

# 最终流量
[[rulesets]]
group = "🐟 漏网之鱼"
ruleset = "[]FINAL"
