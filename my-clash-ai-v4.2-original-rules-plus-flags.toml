; 兼容 pub-api-1.bianyuan.xyz / subconverter 0.7.x 的外部配置
; 注意：这是 INI 语法，但故意保留 .toml 文件名，
; 这样你原来的 config= URL 不需要修改。
; subconverter 会按内容解析，TOML 解析失败后自动按 INI 读取。

[custom]

; ===== 基础配置 =====
clash_rule_base=base/all_base.tpl
enable_rule_generator=true
overwrite_original_rules=true

; ===== Emoji =====
add_emoji=true
remove_old_emoji=true
emoji=(香港|Hong ?Kong),🇭🇰
emoji=(美国|美國|United States|USA),🇺🇸
emoji=(新加坡|Singapore),🇸🇬
emoji=(日本|Japan),🇯🇵
emoji=(韩国|韓國|Korea),🇰🇷
emoji=(英国|英國|United Kingdom|UK),🇬🇧
emoji=(意大利|義大利|Italy),🇮🇹
emoji=(越南|Vietnam),🇻🇳

; ===== 策略组 =====
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`.*

custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`600,,100

custom_proxy_group=🤖 AI服务`select`(?i)(美国|US|USA|United States|洛杉矶|西雅图|圣何塞)`[]🚀 节点选择`[]♻️ 自动选择`.*

custom_proxy_group=🎬 奈飞服务`select`[]🚀 节点选择`[]♻️ 自动选择`.*

custom_proxy_group=✈️ 电报服务`select`[]🚀 节点选择`[]♻️ 自动选择`.*

custom_proxy_group=📺 YouTube`select`[]🚀 节点选择`[]♻️ 自动选择`.*

custom_proxy_group=💻 GitHub`select`[]🚀 节点选择`[]♻️ 自动选择`.*

custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT

; ===== 分流规则 =====
ruleset=🤖 AI服务,clash-classic:https://cdn.jsdelivr.net/gh/VPSDance/ai-proxy-rules@main/rules/clash/all.yaml,86400

ruleset=🎬 奈飞服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list,86400

ruleset=✈️ 电报服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list,86400

ruleset=📺 YouTube,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list,86400

ruleset=💻 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list,86400

ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list,86400

ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list,86400

ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list,86400

ruleset=DIRECT,[]GEOIP,CN

ruleset=🐟 漏网之鱼,[]FINAL
