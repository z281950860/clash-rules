[custom]

; ==========================================
; 精简版 Subconverter 远程配置
; 策略组顺序：
; 1. 节点选择
; 2. 自动选择
; 3. AI
; 4. 国外媒体
; 5. 电报信息
; 其余辅助组在后
; ==========================================

; ---------- AI ----------
ruleset=🤖 AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list,86400
ruleset=🤖 AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list,86400
ruleset=🤖 AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list,86400
ruleset=🤖 AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Copilot/Copilot.list,86400

; ---------- 国外媒体 ----------
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GlobalMedia/GlobalMedia.list,86400

; ---------- Telegram ----------
ruleset=✈️ 电报信息,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list,86400

; ---------- 局域网 / 国内 ----------
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.list,86400
ruleset=🎯 全球直连,[]GEOIP,CN

; ---------- 最终规则 ----------
ruleset=🐟 漏网之鱼,[]FINAL


; ==========================================
; 策略组
; ==========================================

; 1. 节点选择
custom_proxy_group=🟢 节点选择`select`[]♻️ 自动选择`.*`[]DIRECT

; 2. 自动选择
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,5,100

; 3. AI
custom_proxy_group=🤖 AI`select`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🟢 节点选择`[]♻️ 自动选择

; 4. 国外媒体
custom_proxy_group=🌍 国外媒体`select`[]🟢 节点选择`[]♻️ 自动选择`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点

; 5. Telegram
custom_proxy_group=✈️ 电报信息`select`[]🟢 节点选择`[]♻️ 自动选择`[]🇸🇬 新加坡节点

; ---------- 地区辅助组 ----------
custom_proxy_group=🇺🇸 美国节点`select`(?i)(美国|US|United States|America|🇺🇸)
custom_proxy_group=🇯🇵 日本节点`select`(?i)(日本|JP|Japan|东京|大阪|🇯🇵)
custom_proxy_group=🇸🇬 新加坡节点`select`(?i)(新加坡|SG|Singapore|狮城|🇸🇬)

; ---------- 直连与漏网 ----------
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🟢 节点选择
custom_proxy_group=🐟 漏网之鱼`select`[]🟢 节点选择`[]♻️ 自动选择`[]DIRECT


; ==========================================
; 生成规则
; ==========================================
enable_rule_generator=true
overwrite_original_rules=true
