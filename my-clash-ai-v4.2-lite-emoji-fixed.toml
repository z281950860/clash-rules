version = 1

[custom]
clash_rule_base = "base/all_base.tpl"
enable_rule_generator = true
overwrite_original_rules = true
add_emoji = true
remove_old_emoji = true

[[custom_groups]]
name = "🚀 节点选择"
type = "select"
rule = ["[]♻️ 自动选择", ".*"]

[[custom_groups]]
name = "♻️ 自动选择"
type = "url-test"
rule = [".*"]
url = "http://www.gstatic.com/generate_204"
interval = 600
tolerance = 100
lazy = true

[[custom_groups]]
name = "🤖 AI服务"
type = "select"
rule = ["(?i)(美国|US|USA|United States|洛杉矶|西雅图|圣何塞)", "[]🚀 节点选择", "[]♻️ 自动选择", ".*"]

[[custom_groups]]
name = "🎬 奈飞服务"
type = "select"
rule = ["[]🚀 节点选择", "[]♻️ 自动选择", ".*"]

[[custom_groups]]
name = "✈️ 电报服务"
type = "select"
rule = ["[]🚀 节点选择", "[]♻️ 自动选择", ".*"]

[[custom_groups]]
name = "📺 YouTube"
type = "select"
rule = ["[]🚀 节点选择", "[]♻️ 自动选择", ".*"]

[[custom_groups]]
name = "💻 GitHub"
type = "select"
rule = ["[]🚀 节点选择", "[]♻️ 自动选择", ".*"]

[[custom_groups]]
name = "🐟 漏网之鱼"
type = "select"
rule = ["[]🚀 节点选择", "[]♻️ 自动选择", "[]DIRECT"]

[[rulesets]]
group = "🤖 AI服务"
ruleset = "clash-classic:https://cdn.jsdelivr.net/gh/VPSDance/ai-proxy-rules@main/rules/clash/all.yaml"
interval = 86400

[[rulesets]]
group = "🎬 奈飞服务"
ruleset = "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list"
interval = 86400

[[rulesets]]
group = "✈️ 电报服务"
ruleset = "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list"
interval = 86400

[[rulesets]]
group = "📺 YouTube"
ruleset = "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list"
interval = 86400

[[rulesets]]
group = "💻 GitHub"
ruleset = "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list"
interval = 86400

[[rulesets]]
group = "DIRECT"
ruleset = "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list"
interval = 86400

[[rulesets]]
group = "DIRECT"
ruleset = "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list"
interval = 86400

[[rulesets]]
group = "DIRECT"
ruleset = "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list"
interval = 86400

[[rulesets]]
group = "DIRECT"
ruleset = "[]GEOIP,CN"

[[rulesets]]
