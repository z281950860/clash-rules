[custom]

; ==========================================
; V3 精简版 Subconverter 远程配置
; 仅显示 6 个策略组：
; 1. 🚀 节点选择
; 2. ♻️ 自动选择
; 3. 🤖 AI服务
; 4. 🎬 奈飞服务
; 5. ✈️ 电报服务
; 6. 🐟 漏网之鱼
; ==========================================

clash_rule_base=https://raw.githubusercontent.com/z281950860/clash-rules/main/clash-base-v3.yaml

; AI 服务
ruleset=🤖 AI服务,clash-classic:https://cdn.jsdelivr.net/gh/VPSDance/ai-proxy-rules@main/rules/clash/all.yaml,86400

; Netflix
ruleset=🎬 奈飞服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list,86400

; Telegram
ruleset=✈️ 电报服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list,86400

; 国内/局域网直连，不创建单独策略组
ruleset=DIRECT,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.list,86400
ruleset=DIRECT,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax.list,86400
ruleset=DIRECT,[]GEOIP,CN

; 最终流量
ruleset=🐟 漏网之鱼,[]FINAL

; 1. 节点选择
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`.*

; 2. 自动选择
custom_proxy_group=♻️ 自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`300,5,100

; 3. AI 服务
custom_proxy_group=🤖 AI服务`select`[]🚀 节点选择`[]♻️ 自动选择`.*

; 4. 奈飞服务
custom_proxy_group=🎬 奈飞服务`select`[]🚀 节点选择`[]♻️ 自动选择`.*

; 5. 电报服务
custom_proxy_group=✈️ 电报服务`select`[]🚀 节点选择`[]♻️ 自动选择`.*

; 6. 漏网之鱼
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true
