mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
external-controller: 127.0.0.1:9090

clash-for-android:
  append-system-dns: true

unified-delay: true
global-client-fingerprint: chrome
keep-alive-interval: 30

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # 用 IP DNS 做引导解析，避免 DoH 本身域名无法解析
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 普通 DNS
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # 专门解析代理节点 server 域名。
  # 你的节点大量使用 *.aws-agent.net / *.aws-agent.com，
  # 这一项可减少换 Wi-Fi 后整批节点一起超时的情况。
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - 'localhost'
    - 'localhost.*'
    - '*.home.arpa'
    - 'time.*.com'
    - 'time.*.gov'
    - 'pool.ntp.org'
