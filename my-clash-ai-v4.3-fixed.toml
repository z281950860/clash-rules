[[custom_groups]]
name = "🍎 Apple"
type = "select"
rule = ["[]DIRECT", "[]🚀 节点选择"]

[[custom_groups]]
name = "Ⓜ️ Microsoft"
type = "select"
rule = ["[]DIRECT", "[]🚀 节点选择"]

[[custom_groups]]
name = "🛑 广告拦截"
type = "select"
rule = ["[]REJECT", "[]DIRECT"]

[[custom_groups]]
